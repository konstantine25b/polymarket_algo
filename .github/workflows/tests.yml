name: paper-trader tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest is moving to a release Playwright 1.52 cannot install system deps for
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip && pip install -r requirements.txt pytest
      - run: python -m playwright install chromium     # browser download only (the tests use fakes and never launch it); no apt step to break
      - run: python -m pytest src/simulation/paper_trader/tests -q
